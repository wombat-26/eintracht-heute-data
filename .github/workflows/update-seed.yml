name: Seed aktualisieren

on:
  schedule:
    # --- Grundlaeufe: 07:20, 21:20 und 23:20 Berliner Sommerzeit ---
    # Im Winter verschiebt sich alles um eine Stunde nach vorn, also auf
    # 06:20, 20:20 und 22:20 - fuer eine Datenpflege unerheblich.
    #
    # Der Lauf um 21:20 faengt Abendspiele ab, die um 20:45 angepfiffen
    # werden: Um 23:20 sind sie zwar sicher abgepfiffen, aber dann liegt
    # das Ergebnis den halben Abend brach.
    - cron: '20 5,19,21 * * *'

    # --- Livefenster: halbstuendlich, solange Eintracht spielt ---
    # Cron kennt nur die Uhr, nicht den Spielplan. Diese drei Eintraege
    # decken deshalb grosszuegige Fenster ab; ob dahinter Arbeit steckt,
    # entscheidet der Job "gate" anhand des Seeds. Laeuft kein Spiel, ist
    # der Lauf nach Sekunden vorbei.
    #
    # Die Fenster sind eine Stunde breiter als noetig, weil Cron in UTC
    # laeuft und Berlin zwischen UTC+1 und UTC+2 wechselt. Sie decken damit
    # sommers wie winters Freitagabend, Samstag ab Mittag und Sonntag ab.
    - cron: '0,30 16-23 * * 5'
    - cron: '0,30 9-23 * * 6'
    - cron: '0,30 9-22 * * 0'

    # --- Quellenlinks: am 1. und 15. jeden Monats ---
    # Sucht fuer gespielte Partien der laufenden Saison die Seite auf
    # eintracht-archiv.de. Alle vierzehn Tage, weil das Archiv von Hand
    # gepflegt wird und Tage bis Wochen hinterherhaengt - haeufiger zu
    # fragen bringt nichts, seltener laesst Luecken zu lange stehen.
    # (Cron kennt kein "alle 14 Tage"; der 1. und der 15. kommen dem am
    # naechsten und liegen immer im selben Monat.)
    - cron: '40 4 1,15 * *'
  workflow_dispatch:
    inputs:
      full_backfill:
        description: 'Alle Saisons ab 2003 statt nur der laufenden'
        type: boolean
        default: false
      dry_run:
        description: 'Nur prüfen, nichts schreiben'
        type: boolean
        default: false
      archiv_links:
        description: 'Fehlende Quellenlinks auf eintracht-archiv.de suchen'
        type: boolean
        default: false

# Zwei Läufe dürfen sich nie überschneiden - sonst committen beide
# gegen denselben Stand.
concurrency:
  group: seed-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Vorgeschalteter Job statt einer Bedingung an jedem Schritt: Nur so laesst
  # sich der eigentliche Lauf als Ganzes ueberspringen. Kostet einen
  # Job-Start, spart bei einem Lauf ohne Spiel aber Checkout, Python-Setup
  # und rund sechzig Abfragen an OpenLigaDB, ESPN und den DFB.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.pruefen.outputs.run }}
      grund: ${{ steps.pruefen.outputs.grund }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            data/seed_matches.json
            tools/live_gate.py
          sparse-checkout-cone-mode: false

      - name: Laeuft gerade ein Spiel?
        id: pruefen
        env:
          # github.event.schedule enthaelt den Cron-Ausdruck, der den Lauf
          # ausgeloest hat - daran erkennt das Skript die Grundlaeufe, die
          # immer durchlaufen muessen.
          GATE_CRON: ${{ github.event.schedule }}
        run: python3 tools/live_gate.py --seed data/seed_matches.json

      - name: Zusammenfassung
        run: echo "${{ steps.pruefen.outputs.grund }}" >> $GITHUB_STEP_SUMMARY

  update:
    needs: gate
    # Uebersprungen wird NUR bei einem klaren "nein" des Gates. Faellt der
    # Job aus - Sparse-Checkout scheitert, Python fehlt, Seed unlesbar -,
    # steht in outputs.run ein leerer String, und der Lauf findet statt.
    # Die Datenpflege darf nicht daran haengen, dass eine vorgeschaltete
    # Optimierung funktioniert.
    #
    # !cancelled() ist dafuer noetig und kein Beiwerk: Ohne eine
    # Statusfunktion in der Bedingung ueberspringt GitHub jeden Job, dessen
    # needs fehlgeschlagen ist - die Bedingung wird dann gar nicht erst
    # ausgewertet. Nur "run != 'false'" haette den Fehlerfall also genau
    # nicht abgedeckt.
    if: ${{ !cancelled() && needs.gate.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Seed aktualisieren
        id: update
        working-directory: tools
        run: |
          python update_seed.py \
            --seed ../data/seed_matches.json \
            --out-dir ../data \
            --window-days 120 \
            ${{ inputs.full_backfill && '--full-backfill' || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ (github.event.schedule == '40 4 1,15 * *' || inputs.archiv_links) && '--archiv-links' || '' }}

      # Zweite, unabhängige Prüfung: update_seed.py validiert bereits vor dem
      # Schreiben, aber ein separater Lauf gegen die geschriebene Datei fängt
      # auch Fehler beim Serialisieren ab.
      - name: Geschriebene Datei validieren
        if: steps.update.outputs.changed == 'true'
        working-directory: tools
        run: python validate_seed.py ../data/seed_matches.json --min-count 3500

      # Bewusst nicht blockierend: Ein abgekuerzter Vorname ist kosmetisch,
      # kein Datenfehler. providers.loese_abkuerzung() faengt den Regelfall
      # ab; was uebrig bleibt, gehoert in _SCORER_ALIAS - soll aber keinen
      # Seed-Update aufhalten. Treffer stehen in der Job-Zusammenfassung.
      - name: Abgekuerzte Torschuetzennamen melden
        if: steps.update.outputs.changed == 'true'
        continue-on-error: true
        working-directory: tools
        run: |
          echo '### Abgekuerzte Namen' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          python check_abbreviations.py ../data/seed_matches.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Commit
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name  'seed-bot'
          git config user.email 'seed-bot@users.noreply.github.com'
          git add data/
          git commit -m "Seed: ${{ steps.update.outputs.summary }}"
          git push

      # Release-Assets statt GitHub Pages: Ein einziges Release mit festem
      # Tag, dessen Assets bei jedem Lauf ersetzt werden. Dadurch bleiben die
      # Download-URLs stabil (/releases/latest/download/<datei>), und die
      # Pages-Nutzungsbedingungen greifen nicht.
      - name: Release-Assets aktualisieren
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view data >/dev/null 2>&1 || \
            gh release create data --title "Spieldaten" --notes \
              "Automatisch gepflegte Spieldaten. Assets werden bei jedem Lauf ersetzt."
          gh release upload data \
            data/manifest.json \
            data/window.json.gz \
            data/seed_matches.json.gz \
            --clobber

      - name: Zusammenfassung
        if: always()
        run: |
          echo "### Seed-Update" >> $GITHUB_STEP_SUMMARY
          echo "Geändert: ${{ steps.update.outputs.changed }}" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.update.outputs.summary }}" >> $GITHUB_STEP_SUMMARY
